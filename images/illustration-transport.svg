<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Barcelona transport — bus, tram and bike</title>
<rect width="600" height="500" fill="#EAF4F4"/>
<circle cx="490" cy="90" r="42" fill="#F2A93B"/>

<!-- overhead tram wire -->
<line x1="240" y1="150" x2="600" y2="150" stroke="#2E6F71" stroke-width="4"/>

<!-- ===== Bus ===== -->
<g>
  <rect x="55" y="290" width="180" height="100" rx="16" fill="#2E6F71"/>
  <rect x="55" y="368" width="180" height="14" fill="#F2A93B"/>
  <rect x="75" y="312" width="34" height="34" rx="6" fill="#EAF4F4"/>
  <rect x="119" y="312" width="34" height="34" rx="6" fill="#EAF4F4"/>
  <rect x="163" y="312" width="34" height="34" rx="6" fill="#EAF4F4"/>
  <circle cx="95" cy="392" r="20" fill="#1F4E4F"/>
  <circle cx="95" cy="392" r="8" fill="#E8C77E"/>
  <circle cx="195" cy="392" r="20" fill="#1F4E4F"/>
  <circle cx="195" cy="392" r="8" fill="#E8C77E"/>
</g>

<!-- ===== Tram ===== -->
<g>
  <line x1="330" y1="150" x2="330" y2="182" stroke="#2E6F71" stroke-width="4"/>
  <rect x="270" y="182" width="150" height="120" rx="14" fill="#4FA3A8"/>
  <rect x="270" y="264" width="150" height="12" fill="#E8C77E"/>
  <rect x="288" y="204" width="36" height="34" rx="6" fill="#EAF4F4"/>
  <rect x="332" y="204" width="36" height="34" rx="6" fill="#EAF4F4"/>
  <rect x="376" y="204" width="26" height="34" rx="6" fill="#EAF4F4"/>
  <circle cx="305" cy="306" r="18" fill="#1F4E4F"/>
  <circle cx="305" cy="306" r="7" fill="#F2A93B"/>
  <circle cx="385" cy="306" r="18" fill="#1F4E4F"/>
  <circle cx="385" cy="306" r="7" fill="#F2A93B"/>
</g>

<!-- ===== Bicycle ===== -->
<g fill="none" stroke="#E85D4C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="470" cy="360" r="42" stroke="#2E6F71"/>
  <circle cx="560" cy="360" r="42" stroke="#2E6F71"/>
  <path d="M470 360 L512 300 L560 360 M512 300 L494 360 M512 300 L525 300"/>
  <path d="M525 300 L535 288"/>
</g>
<circle cx="470" cy="360" r="6" fill="#F2A93B"/>
<circle cx="560" cy="360" r="6" fill="#F2A93B"/>

<!-- ===== Road ===== -->
<rect x="0" y="410" width="600" height="60" fill="#1F4E4F"/>
<g fill="#E8C77E">
  <rect x="20" y="436" width="40" height="8" rx="4"/>
  <rect x="90" y="436" width="40" height="8" rx="4"/>
  <rect x="160" y="436" width="40" height="8" rx="4"/>
  <rect x="230" y="436" width="40" height="8" rx="4"/>
  <rect x="300" y="436" width="40" height="8" rx="4"/>
  <rect x="370" y="436" width="40" height="8" rx="4"/>
  <rect x="440" y="436" width="40" height="8" rx="4"/>
  <rect x="510" y="436" width="40" height="8" rx="4"/>
</g>
</svg>
