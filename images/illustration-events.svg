<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Barcelona events — festival bunting and fireworks</title>
<rect width="600" height="500" fill="#1F4E4F"/>
<!-- fireworks -->
<g stroke="#F2A93B" stroke-width="5" stroke-linecap="round">
  <line x1="150" y1="170" x2="150" y2="120"/><line x1="150" y1="170" x2="190" y2="140"/><line x1="150" y1="170" x2="110" y2="140"/><line x1="150" y1="170" x2="195" y2="180"/><line x1="150" y1="170" x2="105" y2="180"/>
</g>
<g stroke="#E85D4C" stroke-width="5" stroke-linecap="round">
  <line x1="440" y1="210" x2="440" y2="150"/><line x1="440" y1="210" x2="485" y2="175"/><line x1="440" y1="210" x2="395" y2="175"/><line x1="440" y1="210" x2="492" y2="220"/><line x1="440" y1="210" x2="388" y2="220"/>
</g>
<circle cx="300" cy="120" r="6" fill="#E8C77E"/><circle cx="520" cy="110" r="5" fill="#EAF4F4"/><circle cx="70" cy="90" r="5" fill="#EAF4F4"/>
<!-- bunting -->
<path d="M0 60 Q300 160 600 60" stroke="#EAF4F4" stroke-width="3" fill="none"/>
<g>
  <polygon points="60,80 90,86 70,118" fill="#E85D4C"/><polygon points="150,102 180,106 160,138" fill="#F2A93B"/>
  <polygon points="250,118 280,120 262,152" fill="#E8C77E"/><polygon points="340,118 370,116 352,150" fill="#4FA3A8"/>
  <polygon points="430,106 460,100 446,134" fill="#E85D4C"/><polygon points="520,86 548,78 538,112" fill="#F2A93B"/>
</g>
<!-- crowd / stage -->
<rect x="0" y="380" width="600" height="120" fill="#2E6F71"/>
<g fill="#1F4E4F"><circle cx="90" cy="385" r="26"/><circle cx="170" cy="395" r="22"/><circle cx="260" cy="388" r="28"/><circle cx="360" cy="396" r="24"/><circle cx="450" cy="386" r="27"/><circle cx="530" cy="394" r="22"/></g>
<path d="M200 380 L300 300 L400 380 Z" fill="#E8C77E"/>
</svg>
