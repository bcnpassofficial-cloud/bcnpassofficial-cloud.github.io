<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tossa de Mar castle walls above the beach cove</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="500" cy="80" r="34" fill="#F2A93B"/>
<!-- headland -->
<polygon points="0,260 200,260 260,180 320,240 340,260 600,260 600,400 0,400" fill="#E8C77E"/>
<!-- castle walls on headland -->
<g fill="#2E6F71">
  <rect x="230" y="200" width="18" height="60"/>
  <rect x="260" y="180" width="18" height="80"/>
  <rect x="290" y="195" width="18" height="65"/>
  <rect x="320" y="210" width="18" height="50"/>
  <rect x="200" y="230" width="140" height="30"/>
</g>
<g fill="#1F4E4F">
  <polygon points="230,200 239,185 248,200"/>
  <polygon points="260,180 269,165 278,180"/>
  <polygon points="290,195 299,180 308,195"/>
</g>
<!-- sea and cove -->
<rect x="0" y="260" width="600" height="80" fill="#4FA3A8"/>
<!-- beach -->
<rect x="0" y="340" width="600" height="60" fill="#E8C77E"/>
</svg>
