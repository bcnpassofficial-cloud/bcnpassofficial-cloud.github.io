<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La Roca Village outlet shopping</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="500" cy="80" r="34" fill="#F2A93B"/>
<!-- row of boutique fronts -->
<g>
  <rect x="60" y="200" width="90" height="130" fill="#E85D4C"/>
  <rect x="160" y="200" width="90" height="130" fill="#2E6F71"/>
  <rect x="260" y="200" width="90" height="130" fill="#E8C77E"/>
  <rect x="360" y="200" width="90" height="130" fill="#F2A93B"/>
  <rect x="460" y="200" width="90" height="130" fill="#4FA3A8"/>
</g>
<!-- awnings -->
<g fill="#1F4E4F">
  <polygon points="55,200 165,200 150,180 70,180"/>
  <polygon points="155,200 265,200 250,180 170,180"/>
  <polygon points="255,200 365,200 350,180 270,180"/>
  <polygon points="355,200 465,200 450,180 370,180"/>
  <polygon points="455,200 565,200 550,180 470,180"/>
</g>
<!-- shopfront doors/windows -->
<g fill="#EAF4F4" opacity="0.85">
  <rect x="90" y="240" width="30" height="60"/>
  <rect x="190" y="240" width="30" height="60"/>
  <rect x="290" y="240" width="30" height="60"/>
  <rect x="390" y="240" width="30" height="60"/>
  <rect x="490" y="240" width="30" height="60"/>
</g>
<rect x="0" y="330" width="600" height="70" fill="#E8C77E" opacity="0.6"/>
</svg>
