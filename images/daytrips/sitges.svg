<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sitges beach promenade and church on the point</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="500" cy="80" r="34" fill="#F2A93B"/>
<!-- sea -->
<rect x="0" y="220" width="600" height="90" fill="#4FA3A8"/>
<!-- sand -->
<rect x="0" y="310" width="600" height="90" fill="#E8C77E"/>
<!-- church on the point -->
<rect x="250" y="140" width="70" height="90" fill="#EAF4F4" stroke="#2E6F71" stroke-width="4"/>
<rect x="278" y="100" width="14" height="45" fill="#EAF4F4" stroke="#2E6F71" stroke-width="4"/>
<polygon points="278,100 285,80 292,100" fill="#F2A93B"/>
<!-- whitewashed houses row -->
<g fill="#EAF4F4" stroke="#2E6F71" stroke-width="3">
  <rect x="60" y="180" width="50" height="60"/>
  <rect x="120" y="170" width="55" height="70"/>
  <rect x="360" y="175" width="55" height="65"/>
  <rect x="420" y="185" width="50" height="55"/>
</g>
<!-- beach umbrellas -->
<g>
  <polygon points="120,340 150,340 135,315" fill="#E85D4C"/>
  <rect x="133" y="340" width="4" height="30" fill="#2E6F71"/>
  <polygon points="420,335 450,335 435,310" fill="#2E6F71"/>
  <rect x="433" y="335" width="4" height="30" fill="#1F4E4F"/>
</g>
</svg>
