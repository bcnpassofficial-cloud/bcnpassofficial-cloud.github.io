<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La Molina ski resort in the snow</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="500" cy="80" r="30" fill="#F2A93B"/>
<!-- snowy peaks -->
<polygon points="0,260 100,120 180,220 280,80 380,220 460,140 600,260 600,400 0,400" fill="#3B6DA6"/>
<polygon points="0,280 90,180 160,230 280,140 380,230 470,190 600,280 600,400 0,400" fill="#2E6F71"/>
<g fill="#EAF4F4">
  <polygon points="100,120 85,160 115,160"/>
  <polygon points="280,80 260,130 300,130"/>
  <polygon points="460,140 443,175 477,175"/>
</g>
<!-- ski piste -->
<polygon points="280,140 340,400 220,400" fill="#EAF4F4" opacity="0.55"/>
<!-- chairlift cable -->
<path d="M60,300 L520,150" stroke="#1F4E4F" stroke-width="4" fill="none"/>
<!-- chairlift towers -->
<rect x="150" y="230" width="6" height="65" fill="#1F4E4F"/>
<rect x="330" y="185" width="6" height="55" fill="#1F4E4F"/>
<!-- chairs -->
<g fill="#E85D4C">
  <rect x="195" y="258" width="18" height="10" rx="2"/>
  <rect x="375" y="196" width="18" height="10" rx="2"/>
</g>
<line x1="204" y1="258" x2="204" y2="238" stroke="#1F4E4F" stroke-width="2"/>
<line x1="384" y1="196" x2="384" y2="178" stroke="#1F4E4F" stroke-width="2"/>
<rect x="0" y="360" width="600" height="40" fill="#4FA3A8"/>
</svg>
