<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Roman amphitheatre in Tarragona overlooking the sea</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="90" cy="80" r="34" fill="#F2A93B"/>
<!-- sea -->
<rect x="0" y="280" width="600" height="120" fill="#4FA3A8"/>
<rect x="0" y="280" width="600" height="8" fill="#2E6F71" opacity="0.4"/>
<!-- amphitheatre tiers, arches -->
<g fill="#E8C77E">
  <path d="M100,280 Q300,140 500,280 L500,300 Q300,170 100,300 Z"/>
</g>
<g fill="#2E6F71">
  <path d="M140,280 Q300,175 460,280 L460,296 Q300,200 140,296 Z"/>
</g>
<g fill="#E85D4C" opacity="0.9">
  <rect x="160" y="255" width="18" height="30"/>
  <rect x="200" y="235" width="18" height="45"/>
  <rect x="245" y="220" width="18" height="55"/>
  <rect x="290" y="215" width="18" height="60"/>
  <rect x="335" y="220" width="18" height="55"/>
  <rect x="380" y="235" width="18" height="45"/>
  <rect x="420" y="255" width="18" height="30"/>
</g>
</svg>
