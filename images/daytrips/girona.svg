<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Girona colourful houses on the river</title>
<rect width="600" height="400" fill="#EAF4F4"/>
<circle cx="500" cy="80" r="34" fill="#F2A93B"/>
<!-- cathedral spire in background -->
<polygon points="470,230 490,120 510,230" fill="#2E6F71"/>
<rect x="482" y="230" width="16" height="30" fill="#2E6F71"/>
<!-- river -->
<rect x="0" y="300" width="600" height="100" fill="#4FA3A8"/>
<!-- houses on river, alternating colors -->
<g>
  <rect x="20" y="200" width="60" height="100" fill="#E85D4C"/>
  <rect x="80" y="180" width="55" height="120" fill="#F2A93B"/>
  <rect x="135" y="210" width="60" height="90" fill="#E8C77E"/>
  <rect x="195" y="190" width="58" height="110" fill="#2E6F71"/>
  <rect x="253" y="205" width="60" height="95" fill="#E85D4C"/>
  <rect x="313" y="185" width="55" height="115" fill="#F2A93B"/>
  <rect x="368" y="215" width="58" height="85" fill="#E8C77E"/>
</g>
<g fill="#1F4E4F">
  <rect x="20" y="190" width="60" height="12"/>
  <rect x="80" y="170" width="55" height="12"/>
  <rect x="135" y="200" width="60" height="12"/>
  <rect x="195" y="180" width="58" height="12"/>
  <rect x="253" y="195" width="60" height="12"/>
  <rect x="313" y="175" width="55" height="12"/>
  <rect x="368" y="205" width="58" height="12"/>
</g>
<!-- windows -->
<g fill="#1F4E4F" opacity="0.55">
  <rect x="35" y="230" width="10" height="14"/><rect x="55" y="230" width="10" height="14"/>
  <rect x="95" y="215" width="10" height="14"/><rect x="115" y="215" width="10" height="14"/>
  <rect x="150" y="235" width="10" height="14"/><rect x="170" y="235" width="10" height="14"/>
  <rect x="210" y="220" width="10" height="14"/><rect x="230" y="220" width="10" height="14"/>
</g>
</svg>
