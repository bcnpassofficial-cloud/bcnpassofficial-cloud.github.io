<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img"><title>Weekend trips further afield from Barcelona</title>
<rect width="700" height="260" fill="#EAF4F4"/>
<circle cx="600" cy="55" r="26" fill="#F2A93B"/>
<!-- distant mountain range, further away / hazier -->
<polygon points="0,190 120,110 220,180 340,90 460,180 580,120 700,190 700,260 0,260" fill="#2E6F71" opacity="0.55"/>
<!-- road curving off into the distance -->
<path d="M0,240 Q250,190 340,150 Q430,190 700,240" fill="none" stroke="#1F4E4F" stroke-width="10"/>
<path d="M0,240 Q250,190 340,150 Q430,190 700,240" fill="none" stroke="#E8C77E" stroke-width="2" stroke-dasharray="10,10"/>
<!-- suitcase icon -->
<rect x="150" y="150" width="70" height="50" rx="6" fill="#E85D4C"/>
<rect x="172" y="136" width="26" height="16" rx="4" fill="none" stroke="#E85D4C" stroke-width="6"/>
<rect x="150" y="170" width="70" height="8" fill="#1F4E4F" opacity="0.3"/>
<!-- small car -->
<g>
  <rect x="460" y="190" width="70" height="24" rx="6" fill="#4FA3A8"/>
  <rect x="475" y="176" width="40" height="18" rx="5" fill="#4FA3A8"/>
  <circle cx="478" cy="216" r="9" fill="#1F4E4F"/>
  <circle cx="512" cy="216" r="9" fill="#1F4E4F"/>
</g>
</svg>
